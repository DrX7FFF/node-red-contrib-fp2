<script type="text/javascript">
    RED.nodes.registerType("fp2", {
        category: "input",
        color: "#a6bbcf",
        defaults: {
            name: { value: "" },
            host: { value: "" },
            port: {
                value: "",
                validate: function(value) {
                    return value === "" || (/^\d+$/.test(value) && Number(value) >= 1 && Number(value) <= 65535);
                }
            },
            topicPrefix: { value: "fp2", required: true }
        },
        credentials: {
            pairing: { type: "password" }
        },
        inputs: 0,
        outputs: 1,
        icon: "bridge.svg",
        label: function() { return this.name || "FP2"; },
        oneditprepare: function() {
            const node = this;
            const $select = $("#node-fp2-accessory");
            const $state = $("#node-fp2-pairing-state");
            const $result = $("#node-fp2-pairing-result");
            $state.text("Le pairing sera conserve comme credential Node-RED.");

            $("#node-fp2-discover").on("click", function() {
                const button = $(this);
                button.prop("disabled", true);
                $result.text("Recherche en cours...");
                $select.empty();
                $.getJSON("fp2/pairing/discover")
                    .done(function(response) {
                        for (const device of response.devices || []) {
                            const label = `${device.name} (${device.model || "FP2"}) - ${device.address}`;
                            const option = $("<option>").val(device.token).text(label);
                            if (!device.availableToPair) option.prop("disabled", true);
                            $select.append(option);
                        }
                        $result.text(response.devices?.length ? "Selectionnez un accessoire disponible." : "Aucun accessoire trouve.");
                    })
                    .fail(function(xhr) {
                        $result.text(xhr.responseJSON?.error || "Echec de la decouverte.");
                    })
                    .always(function() {
                        button.prop("disabled", false);
                    });
            });

            $("#node-fp2-pair").on("click", function() {
                const button = $(this);
                const pin = $("#node-fp2-pin").val();
                const token = $select.val();
                if (!token) {
                    $result.text("Recherchez et selectionnez un FP2 disponible.");
                    return;
                }
                button.prop("disabled", true);
                $result.text("Appairage en cours...");
                $.ajax({
                    url: "fp2/pairing/pair",
                    method: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({ token, pin }),
                })
                    .done(function(response) {
                        $("#node-input-credentials-pairing")
                            .val(JSON.stringify(response.pairing))
                            .trigger("change");
                        $("#node-fp2-pin").val("");
                        $state.text("Appairage effectue; deployez pour enregistrer le credential.");
                        $result.text("Le pairing est pret pour ce noeud.");
                    })
                    .fail(function(xhr) {
                        $result.text(xhr.responseJSON?.error || "Echec de l'appairage.");
                    })
                    .always(function() {
                        button.prop("disabled", false);
                    });
            });
        }
    });
</script>

<script type="text/html" data-template-name="fp2">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Nom</label>
        <input type="text" id="node-input-name" placeholder="FP2 salon">
    </div>
    <div class="form-row">
        <label for="node-input-host"><i class="fa fa-globe"></i> Adresse IP</label>
        <input type="text" id="node-input-host" placeholder="Automatique apres decouverte">
    </div>
    <div class="form-row">
        <label for="node-input-port"><i class="fa fa-plug"></i> Port HAP</label>
        <input type="text" id="node-input-port" placeholder="Automatique apres decouverte">
    </div>
    <div class="form-row">
        <label for="node-input-topicPrefix"><i class="fa fa-list"></i> Prefixe</label>
        <input type="text" id="node-input-topicPrefix" placeholder="fp2">
    </div>
    <div class="form-row">
        <label>Appairage</label>
        <span id="node-fp2-pairing-state">Non appaire</span>
    </div>
    <div class="form-row">
        <button type="button" class="red-ui-button" id="node-fp2-discover">Rechercher le FP2</button>
        <select id="node-fp2-accessory" style="width: 100%; margin-top: 8px;" aria-label="Accessoire FP2"></select>
    </div>
    <div class="form-row">
        <label for="node-fp2-pin">Code HomeKit</label>
        <input type="password" id="node-fp2-pin" autocomplete="off" placeholder="XXX-XX-XXX">
    </div>
    <div class="form-row">
        <button type="button" class="red-ui-button" id="node-fp2-pair">Appairer et memoriser</button>
        <span id="node-fp2-pairing-result" role="status"></span>
    </div>
    <div class="form-row">
        <label for="node-input-credentials-pairing">Pairing existant</label>
        <input type="password" id="node-input-credentials-pairing" autocomplete="new-password" placeholder="Coller l'objet aiohomekit JSON (optionnel)">
    </div>
    <div class="form-tips">Pour un accessoire deja appaire, collez ici l'objet de son alias aiohomekit. Cette valeur reste un credential Node-RED.</div>
</script>

<script type="text/html" data-help-name="fp2">
    <p>Entree HomeKit directe pour les changements de presence du FP2, sans MQTT.</p>
    <p>Utilisez Rechercher le FP2, selectionnez l'accessoire, puis saisissez le code HomeKit. Les donnees d'appairage sont memorisees comme credential Node-RED.</p>
    <p>La sortie fournit un message par changement; l'etat initial est lu sans emission. <code>msg.raw</code> contient l'evenement complet emis par le client HAP. N'utilisez pas simultanement le meme appairage dans la gateway Python.</p>
</script>
