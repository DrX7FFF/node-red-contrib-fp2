<script type="text/javascript">
    RED.nodes.registerType("fp2", {
        category: "input",
        color: "#a6bbcf",
        defaults: {
            name: { value: "" },
            topicPrefix: { value: "fp2", required: true }
        },
        credentials: {
            pairing: { type: "password" }
        },
        inputs: 0,
        outputs: 1,
        icon: "bridge.svg",
        label: function() { return this.name || "FP2"; },
        oneditprepare: function() {
            const node = this;
            const $select = $("#node-fp2-accessory");
            const $state = $("#node-fp2-pairing-state");
            const $result = $("#node-fp2-pairing-result");
            $state.text("Pairing will be stored as a Node-RED credential.");

            $("#node-fp2-discover").on("click", function() {
                const button = $(this);
                button.prop("disabled", true);
                $result.text("Searching...");
                $select.empty();
                $.getJSON("fp2/pairing/discover")
                    .done(function(response) {
                        for (const device of response.devices || []) {
                            const label = `${device.name} (${device.model || "FP2"}) - ${device.address}`;
                            const option = $("<option>").val(device.id).text(label);
                            if (!device.availableToPair) option.prop("disabled", true);
                            $select.append(option);
                        }
                        $result.text(response.devices?.length ? "Select an available accessory." : "No accessory found.");
                    })
                    .fail(function(xhr) {
                        $result.text(xhr.responseJSON?.error || "Discovery failed.");
                    })
                    .always(function() {
                        button.prop("disabled", false);
                    });
            });

            $("#node-fp2-pair").on("click", function() {
                const button = $(this);
                const pin = $("#node-fp2-pin").val();
                const id = $select.val();
                if (!id) {
                    $result.text("Search for and select an available FP2.");
                    return;
                }
                button.prop("disabled", true);
                $result.text("Pairing...");
                $.ajax({
                    url: "fp2/pairing/pair",
                    method: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({ id, pin }),
                })
                    .done(function(response) {
                        $("#node-input-pairing")
                            .val(JSON.stringify(response.pairing))
                            .trigger("change");
                        $("#node-fp2-pin").val("");
                        $state.text("Paired; deploy to save the credential.");
                        $result.text("Pairing is ready for this node.");
                    })
                    .fail(function(xhr) {
                        $result.text(xhr.responseJSON?.error || "Pairing failed.");
                    })
                    .always(function() {
                        button.prop("disabled", false);
                    });
            });
        }
    });
</script>

<script type="text/html" data-template-name="fp2">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="FP2 living room">
    </div>
    <div class="form-row">
        <label for="node-input-topicPrefix"><i class="fa fa-list"></i> Prefix</label>
        <input type="text" id="node-input-topicPrefix" placeholder="fp2">
    </div>
    <div class="form-row">
        <label>Pairing</label>
        <span id="node-fp2-pairing-state">Not paired</span>
    </div>
    <div class="form-row">
        <button type="button" class="red-ui-button" id="node-fp2-discover">Search for FP2</button>
        <select id="node-fp2-accessory" style="width: 100%; margin-top: 8px;" aria-label="FP2 accessory"></select>
    </div>
    <div class="form-row">
        <label for="node-fp2-pin">HomeKit code</label>
        <input type="password" id="node-fp2-pin" autocomplete="off" placeholder="XXX-XX-XXX">
    </div>
    <div class="form-row">
        <button type="button" class="red-ui-button" id="node-fp2-pair">Pair and save</button>
        <span id="node-fp2-pairing-result" role="status"></span>
    </div>
    <input type="hidden" id="node-input-pairing">
</script>

<script type="text/html" data-help-name="fp2">
    <p>Use Search for FP2, select the accessory, then enter the HomeKit code.</p>
    <p>The output sends one message per change; the initial state is read without emitting.</p>
</script>
